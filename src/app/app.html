<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header">
  <div class="site-header__inner">
    <a routerLink="/" class="brand">Fable Shop</a>
    <nav aria-label="Main">
      <ul class="nav-list">
        <li>
          <a
            routerLink="/"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            >Products</a
          >
        </li>
        <li>
          <a
            routerLink="/cart"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            [attr.aria-label]="'Cart, ' + cart.count() + ' items'"
          >
            Cart
            <span class="cart-badge" aria-hidden="true">{{ cart.count() }}</span>
          </a>
        </li>
        @if (auth.isAuthenticated()) {
          <li>
            <a routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page"
              >Dashboard</a
            >
          </li>
          <li>
            <button type="button" class="link-button" (click)="logout()">Sign out</button>
          </li>
        } @else {
          <li>
            <a routerLink="/login" routerLinkActive="is-active" ariaCurrentWhenActive="page"
              >Sign in</a
            >
          </li>
        }
      </ul>
    </nav>
  </div>
</header>

<main #main tabindex="-1" id="main-content" class="site-main">
  <router-outlet />
</main>
